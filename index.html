<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <button id="theme-toggle" class="theme-toggle" aria-label="Cambiar tema" title="Cambiar tema">🌙</button>
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
            <li>✦ borra fila</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="start-screen" class="overlay">
      <div class="overlay-box">
        <p class="overlay-heading">TETRIS</p>
        <div class="records-section">
          <span class="label">TOP 5</span>
          <table class="records-table">
            <tbody id="start-records-body"></tbody>
          </table>
          <p id="start-stats" class="records-stats"></p>
        </div>
        <button id="play-btn">Jugar</button>
        <button id="reset-records-btn" class="secondary-btn">Resetear records</button>
      </div>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="overlay-records-section" class="records-section hidden">
          <span class="label">TOP 5</span>
          <table class="records-table">
            <tbody id="overlay-records-body"></tbody>
          </table>
          <p id="overlay-stats" class="records-stats"></p>
        </div>
        <div id="overlay-save-section" class="save-section hidden">
          <input type="text" id="overlay-name-input" maxlength="20" placeholder="Tu nombre" />
          <button id="overlay-save-btn">Guardar</button>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
